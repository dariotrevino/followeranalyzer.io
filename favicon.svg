<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Follower Analyzer: the red disc is everyone you follow, the white ring is
       everyone who follows you. The red edge outside the ring is who doesn't
       follow back. -->
  <rect width="32" height="32" rx="7" fill="#0a0a0f"/>
  <circle cx="12.3" cy="16" r="7.6" fill="#ff5c5c"/>
  <circle cx="19.7" cy="16" r="7.6" fill="#0a0a0f" stroke="#f0eee8" stroke-width="2.4"/>
</svg>
